<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Nền tảng học tập Web Python</title>
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Web Python Platform</h1>
                <p>Đăng nhập vào hệ thống học tập & kiểm tra</p>
            </div>

            {{if .Error}}
            <div class="auth-error">
                {{.Error}}
            </div>
            {{end}}

            <form action="/login" method="POST">
                <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Nhập tên đăng nhập" required autofocus autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-submit">Đăng nhập</button>
            </form>

            <div class="auth-footer">
                Tài khoản thử nghiệm: <strong>student</strong> / <strong>teacher</strong> / <strong>admin</strong> (mật khẩu: [tên]123)
            </div>
        </div>
    </div>
</body>
</html>
